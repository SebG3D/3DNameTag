<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namensanhänger – Betreuer</title>
<link rel="stylesheet" href="staff.css?v=11">
</head>
<body>
<div id="login" class="card hidden">
  <h1>🔒 Betreuer</h1>
  <input id="pin" data-no-osk type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <!-- touch screen without a keyboard (second booth screen): digits on the page -->
  <div class="keys" id="pinKeys">
    <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
    <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
    <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
    <button data-pin="clear">C</button><button data-pin="0">0</button><button data-pin="back">⌫</button>
  </div>
  <button id="loginBtn" class="primary big">Los</button>
  <p id="loginErr" class="err"></p>
</div>

<main id="app" class="hidden">
  <header>
    <nav class="tabs">
      <button data-tab="print" class="primary" title="3D-Druck">🖨️</button>
      <button data-tab="kasse" title="Kasse">🧾<span id="cartBadge" class="badge hidden"></span></button>
      <button data-tab="stats" title="Tag / Statistik">📊</button>
      <button data-tab="settings" title="Einstellungen">⚙️</button>
    </nav>
    <span id="printerChip" class="status">Drucker …</span>
    <button id="orderBtn" class="ordering">🛒 …</button>
    <span id="etaAll" class="muted"></span>
    <span class="spacer"></span>
    <button id="soundBtn" class="small" title="Töne auf diesem Gerät an/aus">🔊</button>
    <a href="/kiosk/" class="small kiosk-link" title="Zum Kiosk">Kiosk</a>
  </header>
  <div id="clockBanner" class="banner bad hidden"></div>

  <div id="settingsView" class="narrow hidden">
    <div id="settingsForm"></div>
    <div class="savebar">
      <span id="settingsMsg" class="muted"></span>
      <button id="settingsCancel">Zurück</button>
      <button id="settingsSave" class="primary">Speichern</button>
    </div>
  </div>

  <div id="statsView" class="narrow hidden"></div>

  <div id="kasseView" class="hidden">
    <section class="col">
      <h2>🧾 Kasse</h2>
      <div id="shopItems" class="shop-items"></div>
    </section>
    <section class="col receipt" id="receipt"></section>
  </div>

  <div id="overview">
    <section class="col">
      <h2>🧱 Platten</h2>
      <div id="plates"></div>
    </section>
    <section class="col">
      <h2>🎁 Abholen</h2>
      <div id="orders"></div>
    </section>
  </div>
</main>

<!-- ordering controls (kiosk open/closed, closing time, wait time, reset) -->
<div id="orderPanel" class="overlay hidden">
  <div class="dialog wide" id="orderPanelBody"></div>
</div>

<!-- big yes/no question (kids use this page: no tiny browser dialogs) -->
<div id="modal" class="overlay hidden">
  <div class="dialog">
    <div id="modalText"></div>
    <div class="dialog-buttons">
      <button id="modalNo" class="big">✕ Nein</button>
      <button id="modalYes" class="big primary">✓ Ja</button>
    </div>
  </div>
</div>

<!-- Kasse: number pad for prices and money given (in cents: 2 5 0 = 2,50 €) -->
<div id="keypad" class="overlay hidden">
  <div class="dialog keypad">
    <p class="q" id="keypadTitle"></p>
    <div id="keypadValue" class="keypad-value"></div>
    <div class="keys">
      <button class="big" data-key="7">7</button><button class="big" data-key="8">8</button><button class="big" data-key="9">9</button>
      <button class="big" data-key="4">4</button><button class="big" data-key="5">5</button><button class="big" data-key="6">6</button>
      <button class="big" data-key="1">1</button><button class="big" data-key="2">2</button><button class="big" data-key="3">3</button>
      <button class="big" data-key="00">00</button><button class="big" data-key="0">0</button><button class="big" data-key="back">⌫</button>
    </div>
    <div class="dialog-buttons">
      <button class="big" data-key="no">✕ Abbrechen</button>
      <button class="big primary" data-key="ok">✓ OK</button>
    </div>
  </div>
</div>

<!-- plate preview, fullscreen; any click closes it -->
<div id="preview" class="overlay hidden"></div>

<script src="sfx.js?v=13"></script>
<script src="staff.js?v=11"></script>
<script src="settings.js?v=11"></script>
<script src="stats.js?v=11"></script>
<script src="ordering.js?v=11"></script>
<script src="kasse.js?v=11"></script>
<script src="osk.js?v=11"></script>
</body>
</html>
