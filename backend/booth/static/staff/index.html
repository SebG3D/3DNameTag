<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namensanhänger – Betreuer</title>
<link rel="stylesheet" href="staff.css?v=4">
</head>
<body>
<div id="login" class="card hidden">
  <h1>🔒 Betreuer</h1>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <button id="loginBtn" class="primary big">Los</button>
  <p id="loginErr" class="err"></p>
</div>

<main id="app" class="hidden">
  <header>
    <span id="printerChip" class="status">Drucker …</span>
    <span id="etaAll" class="muted"></span>
    <span class="spacer"></span>
    <button id="statsBtn" class="small" title="Tag / Statistik">📊</button>
    <button id="settingsBtn" class="small" title="Einstellungen">⚙️</button>
    <a href="/kiosk/" class="small kiosk-link" title="Zum Kiosk">Kiosk</a>
  </header>
  <div id="clockBanner" class="banner bad hidden"></div>

  <div id="settingsView" class="narrow hidden">
    <div id="settingsForm"></div>
    <div class="savebar">
      <span id="settingsMsg" class="muted"></span>
      <button id="settingsCancel">Zurück</button>
      <button id="settingsSave" class="primary">Speichern</button>
    </div>
  </div>

  <div id="statsView" class="narrow hidden"></div>

  <div id="overview">
    <section class="col">
      <h2>🧱 Platten</h2>
      <div id="plates"></div>
    </section>
    <section class="col">
      <h2>🎁 Abholen</h2>
      <div id="orders"></div>
    </section>
  </div>
</main>

<!-- big yes/no question (kids use this page: no tiny browser dialogs) -->
<div id="modal" class="overlay hidden">
  <div class="dialog">
    <div id="modalText"></div>
    <div class="dialog-buttons">
      <button id="modalNo" class="big">✕ Nein</button>
      <button id="modalYes" class="big primary">✓ Ja</button>
    </div>
  </div>
</div>

<!-- plate preview, fullscreen; any click closes it -->
<div id="preview" class="overlay hidden"></div>

<script src="staff.js?v=4"></script>
<script src="settings.js?v=4"></script>
<script src="stats.js?v=4"></script>
</body>
</html>
