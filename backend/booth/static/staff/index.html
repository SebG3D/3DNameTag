<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namensanhänger – Betreuer</title>
<link rel="stylesheet" href="staff.css">
</head>
<body>
<div id="login" class="card hidden">
  <h1>Betreuer-Login</h1>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <button id="loginBtn" class="primary">Anmelden</button>
  <p id="loginErr" class="err"></p>
</div>

<main id="app" class="hidden">
  <header>
    <span id="printerChip" class="chip">Drucker …</span>
    <span id="etaAll" class="muted"></span>
    <button id="pauseBtn" class="small">Pause</button>
    <button id="statsBtn" class="small">📊 Tag</button>
    <button id="settingsBtn" class="small">⚙ Einstellungen</button>
    <a href="/kiosk/" class="small kiosk-link">Kiosk</a>
  </header>
  <p id="pauseReason" class="err hidden"></p>
  <div id="clockBanner" class="banner bad hidden"></div>

  <div id="settingsView" class="hidden">
    <div id="settingsForm"></div>
    <div class="savebar">
      <span id="settingsMsg" class="muted"></span>
      <button id="settingsCancel">Zurück</button>
      <button id="settingsSave" class="primary">Speichern</button>
    </div>
  </div>

  <div id="statsView" class="hidden"></div>

  <div id="overview">
  <section id="plateCard" class="card"></section>

  <section class="card">
    <h2>Warteschlange</h2>
    <div id="waiting"></div>
  </section>

  <section class="card">
    <h2>Bestellungen</h2>
    <div id="orders"></div>
  </section>

  <section class="card">
    <h2>Letzte Platten</h2>
    <div id="plates"></div>
  </section>
  </div>
</main>
<script src="staff.js"></script>
<script src="settings.js"></script>
<script src="stats.js"></script>
</body>
</html>
